<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifikasi Starter Pack Run 2026</title>
    <!-- Mengimpor font Bungee Inline (Hasil), Russo One (Input/Tombol bergaya solid sport), dan Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Russo+One&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0; padding: 0; height: 100vh; height: 100dvh; 
        background-color: #00558E; 
        
        /* 1. GAMBAR UNTUK LAPTOP / TV (LAYAR MENDATAR) */
        background-image: url('https://i.ibb.co.com/nNvB2psn/1.png');
        background-size: contain; background-position: center top; background-repeat: no-repeat;
        font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column;
        justify-content: flex-start; align-items: center; overflow: hidden;
      }
      
      /* 2. GAMBAR KHUSUS UNTUK HP & TABLET BERDIRI (PORTRAIT) */
      @media screen and (orientation: portrait) { 
        body { 
          background-size: 100% 100%; 
          background-image: url('https://i.ibb.co.com/60RmP3g9/2.png'); 
        } 
      }

      /* Posisi Container Utama */
      .content-wrapper { text-align: center; width: 100%; padding: 0 5%; box-sizing: border-box; margin-top: 36vh; }
      @media screen and (orientation: portrait) { 
        .content-wrapper { margin-top: 34vh; } 
      }

      #input-container { display: block; margin-top: 5vh; }
      .input-wrapper { display: flex; justify-content: center; align-items: stretch; gap: 10px; width: 90%; max-width: 550px; margin: 0 auto; }
      
      /* ========================================================
         BAGIAN INPUT, TOMBOL, & HINT (FONT: RUSSO ONE, TEMA PLN)
         ======================================================== */
      .input-bip { 
        background: rgba(255, 255, 255, 0.9); 
        border: 3px solid #FFCC00; /* Kuning PLN */
        border-radius: 20px; 
        color: #00558E; /* Biru PLN */
        font-size: clamp(18px, 4vw, 30px); 
        text-align: center; 
        padding: 15px 20px; 
        flex: 1; 
        outline: none; 
        text-transform: uppercase; 
        font-family: 'Russo One', sans-serif; 
        backdrop-filter: blur(5px); 
        transition: 0.3s; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
      }
      .input-bip::placeholder { 
        color: rgba(0, 85, 142, 0.5); 
        font-size: clamp(14px, 3vw, 22px); 
        -webkit-text-stroke: 0px; 
      }
      .input-bip:focus { 
        border-color: #00A2E9; /* Biru Cyan PLN */
        background: #ffffff; 
      }

      .go-btn { 
        background: #FFCC00; /* Kuning PLN */
        border: 3px solid #00558E; /* Biru PLN */
        border-radius: 20px; 
        color: #00558E; 
        font-size: clamp(16px, 4vw, 25px); 
        padding: 0 25px; 
        cursor: pointer; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        transition: 0.3s; 
        font-family: 'Russo One', sans-serif; 
        letter-spacing: 1px;
      }
      .go-btn:hover { 
        background: #00558E; 
        color: #FFCC00; 
        border-color: #FFCC00; 
      }
      
      .hint-text { 
        font-size: clamp(12px, 2.5vw, 16px); 
        margin-top: 15px; 
        color: #FFCC00; /* Kuning PLN */
        font-family: 'Russo One', sans-serif;
        -webkit-text-stroke: 0.5px #00558E; 
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6); 
      }

      /* ========================================================
         BAGIAN HASIL (TETAP BUNGEE INLINE SEPERTI SEBELUMNYA)
         ======================================================== */
      #result-container { display: none; width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center; }
      
      .result-group { display: flex; flex-direction: column; align-items: center; width: 100%; }
      .result-label { 
        font-size: clamp(12px, 3vw, 18px); 
        color: #FFCC00; /* Kuning PLN */
        font-family: 'Russo One', sans-serif;
        margin-bottom: 6px; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        -webkit-text-stroke: 1px #00558E; 
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6); 
      }
      
      .glass-box {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid black; 
        border-radius: 12px;
        padding: 8px 30px;
        width: fit-content; 
        max-width: 95%;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.15);
        word-wrap: break-word;
      }
      .box-cyan { border-color: black; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25), inset 0 0 10px rgba(255,255,255,0.15); }

      /* HASIL INTI: Bungee Inline & Warna Hitam (Tidak Diubah) */
      .result-bip { 
        font-family: 'Bungee Inline', cursive; 
        font-size: clamp(50px, 10vw, 110px); 
        margin: 0; line-height: 1.1; letter-spacing: 2px; 
        color: black; 
        -webkit-text-stroke: 2px white; 
        text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      }
      .result-nama { 
        font-family: 'Bungee Inline', cursive; 
        font-size: clamp(20px, 5vw, 55px); 
        margin: 0; text-transform: uppercase; line-height: 1.2; 
        color: black; 
        -webkit-text-stroke: 1.5px white; 
        text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      }
      .result-jk { 
        font-family: 'Bungee Inline', cursive; 
        font-size: clamp(14px, 3.5vw, 35px); 
        margin: 0; text-transform: uppercase; line-height: 1.2; 
        color: black; 
        -webkit-text-stroke: 1px white; 
        text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
      }

      /* LOADING, NOT-FOUND, & TOMBOL RESET */
      .loading, .not-found { 
        font-size: clamp(16px, 3vw, 24px); 
        font-family: 'Russo One', sans-serif;
        margin-top: 40px; 
        display: none; 
        letter-spacing: 1px; 
        color: #FFCC00; 
        -webkit-text-stroke: 1px #00558E; 
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6); 
      }
      .not-found { color: #d90000; -webkit-text-stroke: 1px white; } 

      .reset-btn { 
        position: absolute; bottom: clamp(20px, 4vh, 40px); right: clamp(20px, 4vw, 40px); 
        background: #FFCC00; /* Kuning PLN */
        border: 2px solid #00558E; 
        border-radius: 12px; 
        color: #00558E; 
        padding: 10px 20px; 
        font-size: clamp(12px, 2vw, 16px); 
        cursor: pointer; display: none; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; 
        font-family: 'Russo One', sans-serif; 
        z-index: 10; 
      }
      .reset-btn:hover { background: #00558E; color: #FFCC00; border-color: #FFCC00; }
    </style>
  </head>
  <body>

    <button id="btnReset" class="reset-btn" onclick="ulangCarian()">🔄 RESET</button>

    <div class="content-wrapper">
      <div id="input-container">
        <div class="input-wrapper">
          <input type="text" id="inputBIP" class="input-bip" placeholder="NOMOR BIP" onkeypress="semakEnter(event)" inputmode="numeric">
          <button class="go-btn" onclick="jalankanPencarian()">GO</button>
        </div>
        <div class="hint-text">isi ngana pe nomor bip dulu e...</div>
      </div>

      <div id="loading" class="loading">Sabar e, kita da cari ngana pe data...</div>
      <div id="not-found" class="not-found">DATA TIDAK DITEMUKAN</div>

      <div id="result-wrapper" style="display: none;">
        <div id="result-container">
          
          <div class="result-group">
            <div class="result-label">NUMBER</div>
            <div id="result-bip" class="glass-box box-cyan result-bip">0000</div>
          </div>
          
          <div class="result-group">
            <div class="result-label">NAME</div>
            <div id="result-nama" class="glass-box result-nama">NAMA PESERTA</div>
          </div>
          
          <div class="result-group">
            <div class="result-label">GENDER</div>
            <div id="result-jk" class="glass-box result-jk">JENIS KELAMIN</div>
          </div>

        </div>
      </div>

    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbxVaXopX3kfSLJ9V3fjcaLJY9LDikrokGlxhFg1IdTYjZVpr6nTPxcYBGFCZHSuwsc6/exec";

      function semakEnter(event) {
        if (event.key === "Enter" || event.keyCode === 13) {
          event.preventDefault(); 
          document.getElementById('inputBIP').blur(); 
          jalankanPencarian();
        }
      }

      function jalankanPencarian() {
        let bip = document.getElementById('inputBIP').value.trim();
        if (bip === "") return;

        document.getElementById('inputBIP').blur();
        document.getElementById('input-container').style.display = 'none';
        document.getElementById('not-found').style.display = 'none';
        document.getElementById('result-wrapper').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        fetch(API_URL + "?bip=" + encodeURIComponent(bip))
          .then(response => response.json())
          .then(data => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnReset').style.display = 'block'; 

            if (data.found) {
              document.getElementById('result-bip').innerText = bip.toUpperCase();
              document.getElementById('result-nama').innerText = String(data.nama || "-").toUpperCase();
              document.getElementById('result-jk').innerText = String(data.jk || "-").toUpperCase();
              
              document.getElementById('result-wrapper').style.display = 'block';
            } else {
              document.getElementById('not-found').style.display = 'block';
            }
          })
          .catch(error => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnReset').style.display = 'block';
            alert("Terjadi kesalahan jaringan.");
            console.error(error);
          });
      }

      function ulangCarian() {
        document.getElementById('inputBIP').value = ""; 
        document.getElementById('result-wrapper').style.display = 'none';
        document.getElementById('not-found').style.display = 'none';
        document.getElementById('btnReset').style.display = 'none';
        
        document.getElementById('input-container').style.display = 'block';
        document.getElementById('inputBIP').focus(); 
      }
    </script>
  </body>
</html>
