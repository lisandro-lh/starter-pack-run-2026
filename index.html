<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifikasi Starter Pack Run 2026</title>
    <!-- Mengimpor font Montserrat tebal -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0; padding: 0; height: 100vh; height: 100dvh; 
        background-color: #00558E; 
        
        /* 1. GAMBAR UNTUK LAPTOP / TV (LAYAR MENDATAR) */
        background-image: url('https://i.ibb.co.com/nNvB2psn/1.png');
        background-size: contain; background-position: center top; background-repeat: no-repeat;
        font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column;
        justify-content: flex-start; align-items: center; overflow: hidden;
      }
      
      /* 2. GAMBAR KHUSUS UNTUK HP & TABLET BERDIRI (PORTRAIT) */
      @media screen and (orientation: portrait) { 
        body { 
          /* MENGGUNAKAN 100% 100% AGAR GAMBAR BAWAH (PETA/TANGGAL) TIDAK TERPOTONG SAMA SEKALI */
          background-size: 100% 100%; 
          background-image: url('https://i.ibb.co.com/60RmP3g9/2.png'); 
        } 
      }

      /* Posisi Container Utama */
      .content-wrapper { text-align: center; width: 100%; padding: 0 5%; box-sizing: border-box; margin-top: 36vh; }
      @media screen and (orientation: portrait) { 
        /* MENURUNKAN TULISAN KE BAWAH AGAR TIDAK MENUTUPI LOGO HIBUALAMO */
        .content-wrapper { margin-top: 34vh; } 
      }

      #input-container { display: block; margin-top: 5vh; }
      .input-wrapper { display: flex; justify-content: center; align-items: stretch; gap: 10px; width: 90%; max-width: 550px; margin: 0 auto; }
      
      /* Ukuran Input Fleksibel */
      .input-bip { background: rgba(255, 255, 255, 0.6); border: 3px solid black; border-radius: 20px; color: #02680B; font-size: clamp(18px, 4vw, 30px); font-weight: 900; text-align: center; padding: 15px 20px; flex: 1; outline: none; text-transform: uppercase; font-family: 'Montserrat', sans-serif; backdrop-filter: blur(5px); transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
      .input-bip::placeholder { color: rgba(0, 31, 63, 0.6); font-size: clamp(14px, 3vw, 22px); font-weight: 800; -webkit-text-stroke: 0px; }
      .input-bip:focus { border-color: black; background: rgba(255, 255, 255, 0.9); }

      .go-btn { background: #02680B; border: 3px solid black; border-radius: 20px; color: #02680B; font-size: clamp(16px, 4vw, 25px); font-weight: 900; padding: 0 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s; font-family: 'Montserrat', sans-serif; -webkit-text-stroke: 1px white; }
      .go-btn:hover { background: #00558E; color: #02680B; border-color: black; }
      
      .hint-text { font-size: clamp(12px, 2.5vw, 16px); margin-top: 15px; color: #02680B; font-weight: 900; -webkit-text-stroke: 0.5px white; text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9); }

      #result-container { display: none; width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center; }
      
      /* Styling untuk grup dan label (NOMOR PESERTA, NAMA, JK) */
      .result-group { display: flex; flex-direction: column; align-items: center; width: 100%; }
      .result-label { font-size: clamp(12px, 3vw, 18px); font-weight: 900; color: #02680B; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; -webkit-text-stroke: 0.5px white; text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9); }
      
      /* Kotak transparan fleksibel yang menyesuaikan ukuran teks (Glassmorphism) */
      .glass-box {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid black; /* Border kotak hitam */
        border-radius: 12px;
        padding: 8px 30px;
        width: fit-content; 
        max-width: 95%;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 0 10px rgba(255,255,255,0.15);
        color: #02680B; /* Warna Font */
        -webkit-text-stroke: 1.5px white; /* Border Font Putih */
        text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
        word-wrap: break-word;
      }
      
      /* Border khusus nomor peserta agar selaras, kita samakan warnanya jadi hitam */
      .box-cyan { border-color: black; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25), inset 0 0 10px rgba(255,255,255,0.15); }

      /* ========================================================
         UKURAN TEKS SUPER FLEKSIBEL (HP -> TABLET -> LAPTOP)
         Menggunakan Clamp (Minimal, Ideal, Maksimal)
         ======================================================== */
      .result-bip { font-family: 'Montserrat', sans-serif; font-size: clamp(50px, 10vw, 110px); font-weight: 900; margin: 0; line-height: 1.1; letter-spacing: 2px; }
      .result-nama { font-family: 'Montserrat', sans-serif; font-size: clamp(20px, 5vw, 55px); font-weight: 900; margin: 0; text-transform: uppercase; line-height: 1.2; }
      .result-jk { font-family: 'Montserrat', sans-serif; font-size: clamp(14px, 3.5vw, 35px); font-weight: 900; margin: 0; text-transform: uppercase; line-height: 1.2; }

      .loading, .not-found { font-size: clamp(16px, 3vw, 24px); font-weight: 900; margin-top: 40px; display: none; letter-spacing: 1px; color: #02680B; -webkit-text-stroke: 1px white; text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.9); }
      .not-found { color: #d90000; -webkit-text-stroke: 1px white; } 

      .reset-btn { position: absolute; bottom: clamp(20px, 4vh, 40px); right: clamp(20px, 4vw, 40px); background: #00558E; border: 2px solid black; border-radius: 12px; color: #02680B; padding: 10px 20px; font-size: clamp(12px, 2vw, 16px); font-weight: 800; cursor: pointer; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; font-family: 'Montserrat', sans-serif; z-index: 10; -webkit-text-stroke: 0.5px white; }
      .reset-btn:hover { background: #02680B; color: #00558E; border-color: black; -webkit-text-stroke: 1px white; }
    </style>
  </head>
  <body>

    <button id="btnReset" class="reset-btn" onclick="ulangCarian()">🔄 RESET</button>

    <div class="content-wrapper">
      <div id="input-container">
        <div class="input-wrapper">
          <input type="text" id="inputBIP" class="input-bip" placeholder="NOMOR BIP" onkeypress="semakEnter(event)" inputmode="numeric">
          <button class="go-btn" onclick="jalankanPencarian()">GO</button>
        </div>
        <div class="hint-text">isi ngana pe nomor bip dulu e...</div>
      </div>

      <div id="loading" class="loading">Sabar e, kita da cari ngana pe data...</div>
      <div id="not-found" class="not-found">DATA TIDAK DITEMUKAN</div>

      <div id="result-wrapper" style="display: none;">
        <div id="result-container">
          
          <div class="result-group">
            <div class="result-label">Ngana Pe Nomor</div>
            <div id="result-bip" class="glass-box box-cyan result-bip">0000</div>
          </div>
          
          <div class="result-group">
            <div class="result-label">Ngana Pe Nama</div>
            <div id="result-nama" class="glass-box result-nama">NAMA PESERTA</div>
          </div>
          
          <div class="result-group">
            <div class="result-label">Laki kah Perempuan?</div>
            <div id="result-jk" class="glass-box result-jk">JENIS KELAMIN</div>
          </div>

        </div>
      </div>

    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbxVaXopX3kfSLJ9V3fjcaLJY9LDikrokGlxhFg1IdTYjZVpr6nTPxcYBGFCZHSuwsc6/exec";

      function semakEnter(event) {
        if (event.key === "Enter" || event.keyCode === 13) {
          event.preventDefault(); 
          document.getElementById('inputBIP').blur(); 
          jalankanPencarian();
        }
      }

      function jalankanPencarian() {
        let bip = document.getElementById('inputBIP').value.trim();
        if (bip === "") return;

        document.getElementById('inputBIP').blur();
        document.getElementById('input-container').style.display = 'none';
        document.getElementById('not-found').style.display = 'none';
        document.getElementById('result-wrapper').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        fetch(API_URL + "?bip=" + encodeURIComponent(bip))
          .then(response => response.json())
          .then(data => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnReset').style.display = 'block'; 

            if (data.found) {
              document.getElementById('result-bip').innerText = bip.toUpperCase();
              document.getElementById('result-nama').innerText = String(data.nama || "-").toUpperCase();
              document.getElementById('result-jk').innerText = String(data.jk || "-").toUpperCase();
              
              document.getElementById('result-wrapper').style.display = 'block';
            } else {
              document.getElementById('not-found').style.display = 'block';
            }
          })
          .catch(error => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnReset').style.display = 'block';
            alert("Terjadi kesalahan jaringan.");
            console.error(error);
          });
      }

      function ulangCarian() {
        document.getElementById('inputBIP').value = ""; 
        document.getElementById('result-wrapper').style.display = 'none';
        document.getElementById('not-found').style.display = 'none';
        document.getElementById('btnReset').style.display = 'none';
        
        document.getElementById('input-container').style.display = 'block';
        document.getElementById('inputBIP').focus(); 
      }
    </script>
  </body>
</html>
