<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verifikasi Starter Pack Run 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0; padding: 0; min-height: 100vh; min-height: 100dvh; 
        background-color: #10a0e3; 
        background-image: url('https://i.ibb.co.com/bRmsMjjY/1.png');
        background-size: contain; background-position: center top; background-repeat: no-repeat;
        font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column;
        justify-content: flex-start; align-items: center; 
        overflow-y: auto; overflow-x: hidden;
      }
      
      @media screen and (orientation: portrait) { 
        body { 
          background-size: 100% 100%; 
          background-image: url('https://i.ibb.co.com/1ttvpmKF/2.png'); 
          overflow: hidden; 
        } 
      }

      .content-wrapper { 
        text-align: center; width: 100%; padding: 0 5%; box-sizing: border-box; 
        margin-top: 38vh; display: flex; flex-direction: column; align-items: center; 
        justify-content: center; padding-bottom: 20px; 
      }
      
      @media screen and (orientation: portrait) { .content-wrapper { margin-top: 35vh; padding-bottom: 0; } }
      @media screen and (max-height: 500px) and (orientation: landscape) { .content-wrapper { margin-top: 45vh; } }

      #input-container, #podium-input-container { display: block; margin-top: 2vh; width: 100%; }
      #podium-input-container { display: none; } 

      .input-wrapper { display: flex; justify-content: center; align-items: stretch; gap: 8px; width: 90%; max-width: 500px; margin: 0 auto; }
      
      /* Layout Berdampingan (Split) untuk Input dan Hasil Podium */
      .podium-split { 
        display: flex; flex-direction: row; gap: 15px; width: 100%; max-width: 900px; 
        justify-content: center; flex-wrap: wrap; margin: 0 auto; align-items: flex-start;
      }
      .podium-col { 
        display: flex; flex-direction: column; align-items: center; gap: 15px; 
        flex: 1; min-width: 280px; 
      }
      
      .input-bip { 
        background: rgba(255, 255, 255, 0.9); border: none; border-radius: 15px; 
        color: #000000; font-size: clamp(16px, 4vmin, 24px); font-weight: 900; 
        text-align: center; padding: 12px 15px; flex: 1; outline: none; 
        text-transform: uppercase; font-family: 'Montserrat', sans-serif; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.3s; width: 100%; box-sizing: border-box;
      }
      .input-bip::placeholder { color: rgba(0, 0, 0, 0.5); font-size: clamp(14px, 3.5vmin, 16px); font-weight: 800; }
      .input-bip:focus { background: #FFFFFF; box-shadow: 0 6px 15px rgba(0,0,0,0.2); }

      .go-btn { 
        background: #FFFFFF; border: none; border-radius: 15px; color: #000000; 
        font-size: clamp(14px, 3.5vmin, 20px); font-weight: 900; padding: 10px 20px; 
        cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.3s; 
        font-family: 'Montserrat', sans-serif; 
      }
      .go-btn:hover { background: #F1F5F9; }
      
      .hint-text { font-size: clamp(11px, 2.5vmin, 14px); margin-top: 10px; color: #000000; font-weight: 900; }

      #result-container, #podium-result-container { display: none; width: 100%; flex-direction: column; gap: 12px; align-items: center; }
      
      .result-group { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 5px; }
      .result-label { font-size: clamp(11px, 2.5vmin, 15px); font-weight: 900; color: #000000; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
      
      .podium-label {
        font-size: clamp(12px, 3vmin, 16px); font-weight: 900; color: #FFFFFF; text-shadow: 1px 2px 4px rgba(0,0,0,0.8); margin-bottom: 5px;
      }

      /* Style Kategori disesuaikan dengan gambar referensi */
      .main-kategori-label {
        font-size: clamp(14px, 3.5vmin, 18px); font-weight: 900; color: #FFFFFF; 
        text-shadow: 1px 2px 4px rgba(0,0,0,0.8); margin-bottom: 10px; 
        text-transform: uppercase; letter-spacing: 1px;
        background: rgba(0,0,0,0.3); padding: 6px 20px; border-radius: 8px; border: 2px solid #FFF; 
        width: fit-content; margin: 0 auto 10px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      }

      .glass-box {
        background: linear-gradient(90deg, #42df9a 0%, #68d8e3 100%); border: 2px solid #FFFFFF;
        border-radius: 8px; padding: 5px 15px; width: 100%; max-width: 380px; box-sizing: border-box;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3); word-wrap: break-word; text-align: center;
      }

      .result-bip { font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px, 12vmin, 90px); margin: 0; line-height: 1.1; letter-spacing: 3px; color: #FFFFFF; text-shadow: 3px 4px 5px rgba(0,0,0,0.6); }
      .result-nama { font-family: 'Bebas Neue', sans-serif; font-size: clamp(24px, 6vmin, 40px); margin: 0; text-transform: uppercase; line-height: 1.1; letter-spacing: 1px; color: #FFFFFF; text-shadow: 2px 3px 5px rgba(0,0,0,0.6); }
      .result-jk { font-family: 'Bebas Neue', sans-serif; font-size: clamp(16px, 4.5vmin, 30px); margin: 0; text-transform: uppercase; line-height: 1.2; letter-spacing: 1px; color: #FFFFFF; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }

      .loading, .not-found { font-size: clamp(14px, 3.5vmin, 20px); font-weight: 900; margin-top: 30px; display: none; letter-spacing: 1px; color: #000000; }

      .bottom-controls { position: absolute; bottom: clamp(15px, 3vh, 30px); right: clamp(15px, 3vw, 30px); display: flex; gap: 10px; z-index: 10; }

      .btn-action { 
        background: #FFFFFF; border: none; border-radius: 10px; color: #000000; padding: 8px 15px; 
        font-size: clamp(11px, 2.5vmin, 14px); font-weight: 800; cursor: pointer; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; font-family: 'Montserrat', sans-serif; 
      }
      .btn-action:hover { background: #F1F5F9; }
      
      #btnReset { display: none; }

      @media screen and (max-height: 500px) and (orientation: landscape) { .bottom-controls { position: static; margin-top: 20px; justify-content: center; } }
    </style>
  </head>
  <body>

    <div class="bottom-controls">
      <button id="btnMode" class="btn-action" onclick="toggleMode()">🏆 PODMOD</button>
      <button id="btnReset" class="btn-action" onclick="ulangCarian()">🔄 RESET</button>
    </div>

    <div class="content-wrapper">
      
      <!-- MODE NORMAL -->
      <div id="input-container">
        <div class="input-wrapper">
          <input type="text" id="inputBIP" class="input-bip" placeholder="NOMOR BIP" onkeypress="semakEnter(event)" inputmode="numeric">
          <button class="go-btn" onclick="jalankanPencarian()">GO</button>
        </div>
        <div class="hint-text">isi ngana pe nomor bip dulu e...</div>
      </div>

      <!-- MODE PODIUM BERDAMPINGAN (6 INPUT) -->
      <div id="podium-input-container">
        <div class="hint-text" style="margin-top: 0; margin-bottom: 15px; color: #fff; text-shadow: 1px 1px 3px #000; font-size: clamp(14px, 3.5vmin, 18px);">ISI NOMOR BIP UNTUK PODIUM</div>
        
        <div class="podium-split">
          <!-- KOLOM KIRI (Default: LAKI-LAKI) -->
          <div class="podium-col">
            <div class="main-kategori-label">KATEGORI LAKI-LAKI</div>
            <input type="text" id="inputPodiumL1" class="input-bip" placeholder="PODIUM 1 KIRI" inputmode="numeric">
            <input type="text" id="inputPodiumL2" class="input-bip" placeholder="PODIUM 2 KIRI" inputmode="numeric">
            <input type="text" id="inputPodiumL3" class="input-bip" placeholder="PODIUM 3 KIRI" inputmode="numeric">
          </div>
          
          <!-- KOLOM KANAN (Default: PEREMPUAN) -->
          <div class="podium-col">
            <div class="main-kategori-label">KATEGORI PEREMPUAN</div>
            <input type="text" id="inputPodiumP1" class="input-bip" placeholder="PODIUM 1 KANAN" inputmode="numeric">
            <input type="text" id="inputPodiumP2" class="input-bip" placeholder="PODIUM 2 KANAN" inputmode="numeric">
            <input type="text" id="inputPodiumP3" class="input-bip" placeholder="PODIUM 3 KANAN" inputmode="numeric">
          </div>
        </div>
        
        <button class="go-btn" style="width: 90%; max-width: 500px; margin-top: 20px;" onclick="jalankanPencarianPodium()">GO PODIUM</button>
      </div>

      <div id="loading" class="loading">Sabar e, kita da cari ngana pe data...</div>
      <div id="not-found" class="not-found">DATA TIDAK DITEMUKAN</div>

      <!-- HASIL NORMAL -->
      <div id="result-wrapper" style="display: none; width: 100%;">
        <div id="result-container">
          <div class="result-group">
            <div class="result-label">NUMBER</div>
            <div id="result-bip" class="glass-box result-bip">0000</div>
          </div>
          <div class="result-group">
            <div class="result-label">NAME</div>
            <div id="result-nama" class="glass-box result-nama">NAMA PESERTA</div>
          </div>
          <div class="result-group">
            <div class="result-label">GENDER</div>
            <div id="result-jk" class="glass-box result-jk">JENIS KELAMIN</div>
          </div>
        </div>
      </div>

      <!-- HASIL PODIUM BERDAMPINGAN -->
      <div id="podium-result-wrapper" style="display: none; width: 100%;">
        <div id="podium-result-container"></div>
      </div>

    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbxVaXopX3kfSLJ9V3fjcaLJY9LDikrokGlxhFg1IdTYjZVpr6nTPxcYBGFCZHSuwsc6/exec";
      let currentMode = "normal"; 

      function toggleMode() {
        if (currentMode === "normal") {
          currentMode = "podium";
          document.getElementById('btnMode').innerText = "🏃 RACEPACK";
          document.getElementById('input-container').style.display = 'none';
          document.getElementById('result-wrapper').style.display = 'none';
          document.getElementById('podium-input-container').style.display = 'block';
          document.getElementById('podium-result-wrapper').style.display = 'none';
        } else {
          currentMode = "normal";
          document.getElementById('btnMode').innerText = "🏆 PODMOD";
          document.getElementById('podium-input-container').style.display = 'none';
          document.getElementById('podium-result-wrapper').style.display = 'none';
          document.getElementById('input-container').style.display = 'block';
          document.getElementById('result-wrapper').style.display = 'none';
        }
        document.getElementById('btnReset').style.display = 'none';
        document.getElementById('not-found').style.display = 'none';
        document.getElementById('loading').style.display = 'none';
      }

      function semakEnter(event) {
        if (event.key === "Enter" || event.keyCode === 13) {
          event.preventDefault(); document.getElementById('inputBIP').blur(); jalankanPencarian();
        }
      }

      function jalankanPencarian() {
        let bip = document.getElementById('inputBIP').value.trim();
        if (bip === "") return;
        document.getElementById('inputBIP').blur();
        document.getElementById('input-container').style.display = 'none';
        document.getElementById('not-found').style.display = 'none';
        document.getElementById('result-wrapper').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        fetch(API_URL + "?bip=" + encodeURIComponent(bip))
          .then(response => response.json())
          .then(data => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnReset').style.display = 'block'; 
            if (data.found) {
              document.getElementById('result-bip').innerText = bip.toUpperCase();
              document.getElementById('result-nama').innerText = String(data.nama || "-").toUpperCase();
              document.getElementById('result-jk').innerText = String(data.jk || "-").toUpperCase();
              document.getElementById('result-wrapper').style.display = 'block';
              document.getElementById('result-container').style.display = 'flex';
            } else {
              document.getElementById('not-found').style.display = 'block';
            }
          })
          .catch(error => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('btnReset').style.display = 'block';
            alert("Terjadi kesalahan jaringan."); console.error(error);
          });
      }

      async function jalankanPencarianPodium() {
        try {
          const inputIDs = [
            'inputPodiumL1', 'inputPodiumL2', 'inputPodiumL3', // Kolom Kiri
            'inputPodiumP1', 'inputPodiumP2', 'inputPodiumP3'  // Kolom Kanan
          ];
          
          const bips = inputIDs.map(id => {
            const el = document.getElementById(id);
            return el ? el.value.trim() : "";
          });

          if (bips.every(b => b === "")) return;

          inputIDs.forEach(id => {
            const el = document.getElementById(id);
            if(el) el.blur();
          });
          
          document.getElementById('podium-input-container').style.display = 'none';
          document.getElementById('not-found').style.display = 'none';
          document.getElementById('podium-result-wrapper').style.display = 'none';
          document.getElementById('loading').style.display = 'block';
          document.getElementById('btnReset').style.display = 'none';

          const fetchPromises = bips.map(bip => {
            if (!bip) return Promise.resolve(null);
            return fetch(API_URL + "?bip=" + encodeURIComponent(bip))
              .then(res => res.json())
              .catch(() => ({ found: false }));
          });

          const results = await Promise.all(fetchPromises);
          
          document.getElementById('loading').style.display = 'none';
          document.getElementById('btnReset').style.display = 'block';
          
          let htmlKiri = '';
          let htmlKanan = '';
          let hasAnyData = false;

          // ==========================================
          // DETEKSI KATEGORI OTOMATIS BERDASARKAN DATA
          // ==========================================
          
          // Deteksi Kategori Kiri (Index 0, 1, 2)
          let leftKategori = "KATEGORI LAKI-LAKI"; // Default
          for(let i = 0; i < 3; i++) {
            if(results[i] && results[i].found && results[i].jk) {
              let jk = String(results[i].jk).toUpperCase();
              if(jk === "P" || jk.includes("PEREMPUAN")) leftKategori = "KATEGORI PEREMPUAN";
              else if(jk === "L" || jk.includes("LAKI")) leftKategori = "KATEGORI LAKI-LAKI";
              break; // Kategori ditemukan, hentikan pencarian kolom ini
            }
          }

          // Deteksi Kategori Kanan (Index 3, 4, 5)
          let rightKategori = "KATEGORI PEREMPUAN"; // Default
          for(let i = 3; i < 6; i++) {
            if(results[i] && results[i].found && results[i].jk) {
              let jk = String(results[i].jk).toUpperCase();
              if(jk === "P" || jk.includes("PEREMPUAN")) rightKategori = "KATEGORI PEREMPUAN";
              else if(jk === "L" || jk.includes("LAKI")) rightKategori = "KATEGORI LAKI-LAKI";
              break; // Kategori ditemukan, hentikan pencarian kolom ini
            }
          }

          // ==========================================
          // RENDER DATA PODIUM
          // ==========================================

          // Render Kolom Kiri
          for(let i = 0; i < 3; i++) {
            let data = results[i];
            if (data) {
              hasAnyData = true;
              let rank = i + 1;
              let nomorBip = bips[i].toUpperCase();
              let namaPeserta = data.found ? String(data.nama || "-").toUpperCase() : "TIDAK DITEMUKAN";
              htmlKiri += `
                <div class="result-group">
                  <div class="podium-label">PODIUM ${rank} - BIP: ${nomorBip}</div>
                  <div class="glass-box result-nama">: ${namaPeserta}</div>
                </div>
              `;
            }
          }

          // Render Kolom Kanan
          for(let i = 3; i < 6; i++) {
            let data = results[i];
            if (data) {
              hasAnyData = true;
              let rank = (i - 3) + 1;
              let nomorBip = bips[i].toUpperCase();
              let namaPeserta = data.found ? String(data.nama || "-").toUpperCase() : "TIDAK DITEMUKAN";
              htmlKanan += `
                <div class="result-group">
                  <div class="podium-label">PODIUM ${rank} - BIP: ${nomorBip}</div>
                  <div class="glass-box result-nama">: ${namaPeserta}</div>
                </div>
              `;
            }
          }

          if (!hasAnyData) {
             document.getElementById('not-found').style.display = 'block';
          } else {
             // Gabungkan jadi HTML berdampingan
             let finalHtml = `<div class="podium-split">`;
             
             if (htmlKiri !== '') {
               finalHtml += `
                 <div class="podium-col">
                   <div class="main-kategori-label">${leftKategori}</div>
                   ${htmlKiri}
                 </div>
               `;
             }

             if (htmlKanan !== '') {
               finalHtml += `
                 <div class="podium-col">
                   <div class="main-kategori-label">${rightKategori}</div>
                   ${htmlKanan}
                 </div>
               `;
             }

             finalHtml += `</div>`;
             
             document.getElementById('podium-result-container').innerHTML = finalHtml;
             document.getElementById('podium-result-container').style.display = 'block'; 
             document.getElementById('podium-result-wrapper').style.display = 'block';
          }

        } catch (error) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('btnReset').style.display = 'block';
          alert("Terjadi kesalahan jaringan atau sistem.");
          console.error(error);
        }
      }

      function ulangCarian() {
        document.getElementById('btnReset').style.display = 'none';
        document.getElementById('not-found').style.display = 'none';
        document.getElementById('loading').style.display = 'none';

        if (currentMode === "normal") {
          document.getElementById('inputBIP').value = ""; 
          document.getElementById('result-wrapper').style.display = 'none';
          document.getElementById('input-container').style.display = 'block';
          document.getElementById('inputBIP').focus(); 
        } else {
          ['inputPodiumL1','inputPodiumL2','inputPodiumL3',
           'inputPodiumP1','inputPodiumP2','inputPodiumP3'].forEach(id => {
             let el = document.getElementById(id);
             if(el) el.value = "";
          });
          
          document.getElementById('podium-result-wrapper').style.display = 'none';
          document.getElementById('podium-input-container').style.display = 'block';
        }
      }
    </script>
  </body>
</html>
